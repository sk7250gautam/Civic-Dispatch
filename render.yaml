# ==============================================================================
# CIVIC DISPATCH — Render Blueprint Configuration (render.yaml)
# Deploy full-stack municipal platform with 1 click on Render
# ==============================================================================
services:
  # 1. Backend Flask API Service
  - type: web
    name: civic-dispatch-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && flask seed-db && gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 run:app
    healthCheckPath: /api/v1/public/stats
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: civic-dispatch-db
          property: connectionString
      - key: AI_PROVIDER
        value: local

  # 2. Frontend React Vite Static Site
  - type: web
    name: civic-dispatch-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: civic-dispatch-backend
          property: host

databases:
  # 3. PostgreSQL Database
  - name: civic-dispatch-db
    plan: free
    region: oregon
    databaseName: civic_dispatch
    user: civic_admin
