# ==============================================================================
# CIVIC DISPATCH — Multi-Container Production Docker Compose
# Services: PostgreSQL 16, Redis 7, Flask API, Celery Worker, Celery Beat, Nginx SPA
# ==============================================================================
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: civic_dispatch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civic_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-civic_dispatch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civic_admin} -d ${POSTGRES_DB:-civic_dispatch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civic_dispatch_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civic_dispatch_api
    restart: unless-stopped
    command: >
      sh -c "flask seed-db &&
             gunicorn --bind 0.0.0.0:5000 --workers 4 --threads 2 --timeout 60 run:app"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-civic_admin}:${POSTGRES_PASSWORD:-civic_secure_pass_2026}@db:5432/${POSTGRES_DB:-civic_dispatch}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RATELIMIT_STORAGE_URI=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-civic-dispatch-super-secret-key-change-in-production}
      - UPLOAD_FOLDER=/app/uploads
      - AI_PROVIDER=${AI_PROVIDER:-local}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civic_dispatch_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-civic_admin}:${POSTGRES_PASSWORD:-civic_secure_pass_2026}@db:5432/${POSTGRES_DB:-civic_dispatch}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-civic-dispatch-super-secret-key-change-in-production}
      - UPLOAD_FOLDER=/app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      api:
        condition: service_started

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civic_dispatch_celery_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-civic_admin}:${POSTGRES_PASSWORD:-civic_secure_pass_2026}@db:5432/${POSTGRES_DB:-civic_dispatch}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-civic-dispatch-super-secret-key-change-in-production}
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civic_dispatch_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
